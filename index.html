<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualize Slides</title>
<style>
  :root {
    --bg: #0b0f17; --card: #121a28; --line: #223047;
    --fg: #e6edf3; --sub: #9aa7b8; --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 32px; margin: 0 0 8px; border-left: 6px solid var(--accent); padding-left: 16px; }
  .lead { color: var(--sub); margin: 0 0 40px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  a.card {
    display: block; padding: 20px 22px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card h2 { font-size: 20px; margin: 0 0 6px; }
  .card p { margin: 0; color: var(--sub); font-size: 14px; line-height: 1.6; }
  .meta { margin-top: 12px; font-size: 12px; color: #5b6678; }
  .links { margin-top: 10px; font-size: 13px; }
  .links a { color: var(--sub); margin-right: 14px; }
</style>
</head>
<body>
<main>
  <h1>Visualize Slides</h1>
  <p class="lead">データ構造やアルゴリズムを可視化したスライドの置き場です。</p>
  <ul>
    <!-- スライドを追加するときは、ここに li を1つ足す -->
    <li>
      <a class="card" href="btree-rtree/index.html">
        <h2>B-treeとR-treeを可視化してみた</h2>
        <p>なぜXYの複合インデックスでは足りないのか？ (x, y) の辞書順と R-tree の MBR による枝刈りを、同じ点群で比べます。</p>
        <div class="meta">ゆるトーク · 約5分 · 25ステップ</div>
      </a>
      <div class="links"><a href="btree-rtree/README.md">README</a><a href="btree-rtree/script.md">台本</a></div>
    </li>
  </ul>
</main>
</body>
</html>
